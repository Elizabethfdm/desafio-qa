name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: desafio_qa_ci
      JWT_SECRET: ci-only-secret
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Gerar bundle do front
        run: npm run build:web

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Preparar dados iniciais
        run: npm run seed

      - name: Subir a aplicação e conferir o health check
        run: |
          npm start > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Aplicação no ar"
              curl -s http://localhost:3000/api/health
              exit 0
            fi
            sleep 2
          done
          echo "Aplicação não subiu a tempo"
          cat app.log
          exit 1

      - name: Executar testes de API
        run: npm run test:api
        continue-on-error: true

      - name: Executar testes E2E
        run: npm run test:e2e
        continue-on-error: true

      - name: Publicar relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            reports/playwright-report
            reports/test-results
          if-no-files-found: warn
          retention-days: 7